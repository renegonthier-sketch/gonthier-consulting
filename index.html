de:{nav:["Wo es hakt","Der Check","Ergebnis","Über mich"],cta:"Erstgespräch",eye:"",hero:"Sie haben entschieden, investiert, kommuniziert. Trotzdem bewegt sich zu wenig.",lead:"Bevor Sie die nächste Massnahme draufsetzen, sollten wir klären, warum die letzte ihre Wirkung verloren hat.",primary:"Vertrauliches Erstgespräch",secondary:"So läuft der Check ab",micro:"45 Minuten · vertraulich · kein Verkaufsgespräch",rEye:"Kommt Ihnen das bekannt vor?",rTitle:"Sie haben es klar gesagt. Trotzdem passiert etwas anderes.",sym:[["Ich muss immer wieder selbst eingreifen","Obwohl das eigentlich nicht mehr nötig sein sollte."],["Gute Leute gehen oder kündigen innerlich","Und Sie wissen nicht genau, woran es liegt."],["Wir haben alles bereitgestellt","Und verkaufen trotzdem nicht so, wie wir sollten."]],note:"Das ist kein Kompetenzproblem. Zwischen Entscheidung und Alltag geht etwas verloren.",oEye:"So starten wir",oTitle:"Der Check",oLead:"Ein Blick von aussen: Wo genau geht die Wirkung verloren?",oText:"In vier Wochen gleiche ich ab, was die Geschäftsleitung erreichen will, was Führungskräfte daraus machen und was Mitarbeitende tatsächlich erleben. Kein breiter Kulturbericht. Kein verstecktes Personenranking. Ein ehrliches Röntgenbild für Ihre nächsten Entscheidungen.",facts:[["4 Wochen","klar begrenzter Zeitrahmen"],["3–5 Punkte","die wirklich etwas verändern"],["90 Tage","dann sehen Sie die Wirkung"]],pEye:"So gehen wir vor",pTitle:"Vom Vermuten zum Wissen.",process:[["01","Verstehen","Wir klären Strategie, Anlass und die Frage, die Sie wirklich beantworten müssen."],["02","Zuhören","Vertrauliche Gespräche zeigen, wie Entscheidungen im Unternehmen ankommen."],["03","Abgleichen","Ich zeige, wo Plan und Alltag auseinandergehen."],["04","Priorisieren","Sie erhalten 3–5 klare Punkte, klare Verantwortliche und einen Plan für 90 Tage."]],resEye:"Was danach klarer ist",resTitle:"Sie wissen, wo es hakt – bevor Sie das nächste Programm starten.",results:["Welche Entscheidungen nicht so ankommen, wie sie gemeint sind.","Wo Führungskräfte unterschiedliche Dinge sagen und tun.","Was Sie bisher übersehen haben – und was schon gut läuft.","Was zuerst verändert werden muss – und was warten kann.","Woran Sie in den nächsten 90 Tagen Fortschritt erkennen."],fitT:"Für wen das passt",fit:"Für CEOs und Geschäftsleitungen, bei denen eine wichtige Entscheidung nicht so wirkt wie geplant.",noT:"Wann es nicht passt",no:"Wenn Sie nur eine Mitarbeiterbefragung, eine fertige Standardlösung oder eine Bestätigung Ihrer bisherigen Sicht suchen.",aEye:"René Gonthier",aTitle:"Ich habe nicht als Berater angefangen. Ich habe angefangen zu führen.",aText:"Seit über 25 Jahren arbeite ich in Geschäftsleitungen, mit Boards und internationalen Teams. Ich kenne den Druck, wenn die Strategie stimmt, die Zahlen zählen – und die Mannschaft trotzdem nicht mitzieht. Heute bringe ich diesen Blick in Situationen, in denen ein CEO keine weitere Präsentation braucht, sondern eine ehrliche Einschätzung und einen klaren nächsten Schritt.",proof:["25+ Jahre GL- und Board-Erfahrung","Führung internationaler Teams in DACH und EMEA","Bis zu 240 % Zielerreichung – durch Klarheit, Entwicklung und Verbindlichkeit","Direkte, vertrauliche Zusammenarbeit ohne Umwege"],quote:"René nimmt sich die Zeit, wirklich zu verstehen, wo es im Alltag hakt – nicht nur, was auf den ersten Blick sichtbar ist. Seine strukturierte, empathische Art macht den Unterschied zwischen einem guten Gespräch und echter Veränderung.",quoteBy:"Geschäftsführerin · Dienstleistungsunternehmen · 85 Mitarbeitende",cEye:"Der nächste Schritt",cTitle:"Lassen Sie uns klären, warum es nicht wirkt wie geplant.",cText:"Im vertraulichen Erstgespräch klären wir Ihre Situation und ob der Check der richtige Einstieg ist.",cCta:"Gespräch vereinbaren",footer:"Wo Strategie im Alltag Wirkung verliert, schaffen wir Klarheit.",legal:["Impressum","Datenschutz"],anchor:"Er hört dir zu."},
en:{nav:["Where it gets stuck","The Check","Outcome","About"],cta:"First conversation",eye:"",hero:"You decided. You invested. You communicated it. Still, too little is moving.",lead:"Before you add the next measure, let's clarify why the last one lost its effect.",primary:"Confidential first conversation",secondary:"How the Check works",micro:"45 minutes · confidential · no sales pitch",rEye:"Does this sound familiar?",rTitle:"You made it clear. Yet something different happens.",sym:[["I keep having to step in myself","Even though that shouldn't be necessary anymore."],["Good people leave, or quietly check out","And you don't know exactly why."],["We gave the team everything it needed","And still, we're not selling the way we should."]],note:"This is not a competence problem. Something gets lost between the decision and daily work.",oEye:"How we start",oTitle:"The Check",oLead:"An outside view: where exactly is the impact getting lost?",oText:"Over four weeks, I compare what the executive team intends, how leaders translate it and what employees actually experience. No broad culture report. No hidden people ranking. A candid organisational X-ray for your next decisions.",facts:[["4 weeks","a clearly bounded timeframe"],["3–5 points","that actually change something"],["90 days","then you'll see the results"]],pEye:"How we work",pTitle:"From guessing to knowing.",process:[["01","Understand","We clarify the strategy, the trigger and the question you truly need answered."],["02","Listen","Confidential conversations reveal how decisions land in the organisation."],["03","Compare","I show you where the plan and daily reality drift apart."],["04","Prioritise","You get 3–5 clear points, clear owners and a 90-day plan."]],resEye:"What becomes clearer",resTitle:"You know where it gets stuck – before launching the next programme.",results:["Which decisions do not land as intended.","Where leaders say one thing and do another.","What you've been missing – and what's already wo
